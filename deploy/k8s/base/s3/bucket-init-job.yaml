# Creates the pipeline and snapshot buckets once the store is up (bucket-init.sh, idempotent).
#
# A short TTL removes the finished Job, so every `kubectl apply -k` runs it again; that is
# harmless (create returns 409, HEAD decides) and re-proves the credentials after a rotation.
# The script ConfigMap has a fixed name for the same reason: a hash-suffixed name would change
# the pod template of a Job that still exists, which Kubernetes rejects as immutable.
apiVersion: batch/v1
kind: Job
metadata:
  name: s3-bucket-init
spec:
  backoffLimit: 6
  activeDeadlineSeconds: 900
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: s3-bucket-init
        app.kubernetes.io/component: object-store
        people-index.io/s3-client: "true"
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        # The seaweed user of the SeaweedFS image; numeric so runAsNonRoot can check it.
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: snapshot-bucket-init
          image: chrislusf/seaweedfs:4.48@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
          command: ["/bin/sh", "/scripts/bucket-init.sh"]
          env:
            - {name: S3_ENDPOINT, value: "http://s3:8333"}
            - {name: S3_BUCKET, value: people-index-snapshots}
          envFrom:
            - secretRef: {name: snapshot-s3-credentials}
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: scripts, mountPath: /scripts, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      containers:
        - name: bucket-init
          # The store's own image (it has curl): no separate image whose pinned digest a registry
          # could delete, and Dependabot bumps it with the store.
          image: chrislusf/seaweedfs:4.48@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
          command: ["/bin/sh", "/scripts/bucket-init.sh"]
          env:
            - name: S3_ENDPOINT
              value: http://s3:8333
            - name: S3_BUCKET
              value: people-index
            - name: AWS_REGION
              valueFrom:
                configMapKeyRef:
                  name: people-index-config
                  key: AWS_REGION
          envFrom:
            - secretRef:
                name: s3-credentials
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: scripts
          configMap:
            name: s3-bucket-init
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
