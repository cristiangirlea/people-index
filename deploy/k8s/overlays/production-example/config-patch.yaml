# The external bucket. On AWS the regional endpoint could be left to the SDK; it is spelled out
# so the same patch works for any S3-compatible provider. The bucket must exist already and
# support conditional writes (If-None-Match / If-Match on PUT; AWS S3 does). Publish
# cleans old segment data; do not expire runs/ because it contains run history (plans, summaries, quarantine).
apiVersion: v1
kind: ConfigMap
metadata:
  name: people-index-config
data:
  PI_STORE_URL: s3://people-index/
  PI_S3_ENDPOINT: https://s3.eu-west-1.amazonaws.com
  AWS_REGION: eu-west-1
  PI_INDEX_REPLICAS: "1"
  # Per-task memory: 1 GiB + 256 MiB + 8 x 64 MiB + 32 MiB = about 1.8 GiB, within
  # WORKER_MEMORY / WORKER_CONCURRENCY (4Gi / 2, jobs.vars) and the 2Gi coordinator.
  PI_TASK_MEMORY_BYTES: 1GiB
  PI_BUFFER_BYTES: 256MiB
  PI_SEGMENT_TARGET_BYTES: 64MiB
