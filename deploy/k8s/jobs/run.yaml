# One pipeline run: a coordinator Job (`people-index run`) and a worker Job
# (`people-index worker`, ${WORKERS} pods). Rendered by render.sh, which fills every ${...}
# from the overlay's jobs.vars and the environment and refuses to print anything with a
# placeholder left; apply the result with kubectl. Both Jobs share PI_RUN_ID, so every pod
# works on the same `runs/<run_id>/` prefix in the object store.
#
# Failure handling, matching docs/ARCHITECTURE.md:
# - A worker that dies loses its lease; another worker takes the task over. The Job replaces
#   failed worker pods up to backoffLimit.
# - The coordinator resumes from the commits already in the store when its Job restarts it
#   after a crash (OOM kill, signal). Exit code 1 means the run failed for good: the Job fails
#   at once (podFailurePolicy FailJob) instead of restarting into a resumed run whose workers
#   have already exited. `make resume RUN_ID=<id>` (it replaces the Jobs) is the deliberate way to retry it.
# - Evictions, drains and preemptions (pod condition DisruptionTarget) do not count against
#   backoffLimit (podFailurePolicy), so a node rotation never fails a run.
# - activeDeadlineSeconds bounds a stuck run; ttlSecondsAfterFinished keeps the finished Jobs
#   (and their logs) for a day.
#
# The worker Job has no `completions`: it is a work queue. Workers exit 0 once the run is
# published or failed, and the Job completes when they have all exited.
apiVersion: batch/v1
kind: Job
metadata:
  name: pi-run-${RUN_ID}
  namespace: people-index
  labels:
    app.kubernetes.io/name: people-index
    app.kubernetes.io/component: coordinator
    app.kubernetes.io/part-of: people-index
    people-index.io/run-id: "${RUN_ID}"
spec:
  parallelism: 1
  completions: 1
  backoffLimit: 4
  activeDeadlineSeconds: ${RUN_DEADLINE_SECONDS}
  ttlSecondsAfterFinished: 86400
  podFailurePolicy:
    rules:
      - action: Ignore
        onPodConditions:
          - type: DisruptionTarget
      - action: FailJob
        onExitCodes:
          containerName: people-index
          operator: In
          values: [1]
  template:
    metadata:
      labels:
        app.kubernetes.io/name: people-index
        app.kubernetes.io/component: coordinator
        app.kubernetes.io/part-of: people-index
        people-index.io/run-id: "${RUN_ID}"
        people-index.io/es-client: "true"
        people-index.io/s3-client: "true"
    spec:
      restartPolicy: Never
      serviceAccountName: people-index-pipeline
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: people-index
          image: ${IMAGE}
          imagePullPolicy: ${IMAGE_PULL_POLICY}
          args: ["run"]
          envFrom:
            - configMapRef:
                name: people-index-config
          env:
            - name: PI_RUN_ID
              value: "${RUN_ID}"
            - name: PI_WORKER_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: PI_CONCURRENCY
              value: "${COORDINATOR_CONCURRENCY}"
            - name: PI_ES_USERNAME
              valueFrom:
                secretKeyRef:
                  name: pipeline-es-credentials
                  key: username
            - name: PI_ES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pipeline-es-credentials
                  key: password
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: s3-credentials
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: s3-credentials
                  key: AWS_SECRET_ACCESS_KEY
            - name: TMPDIR
              value: /tmp
          ports:
            - name: metrics
              containerPort: 9464
          # The coordinator runs every stage of one task or fewer itself, an extract stage with
          # one input file included, one task at a time: the limit must hold one task as the
          # ConfigMap sizes it (PI_TASK_MEMORY_BYTES, PI_BUFFER_BYTES, PI_SEGMENT_TARGET_BYTES;
          # docs/OPERATIONS.md, Sizing).
          resources:
            requests:
              cpu: "${COORDINATOR_CPU}"
              memory: "${COORDINATOR_MEMORY}"
              ephemeral-storage: 256Mi
            limits:
              memory: "${COORDINATOR_MEMORY}"
              ephemeral-storage: "${TMP_SIZE}"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: es-ca
              mountPath: /etc/people-index/es-ca
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: es-ca
          secret:
            secretName: es-es-http-certs-public
            items:
              - key: ca.crt
                path: ca.crt
        - name: tmp
          emptyDir:
            sizeLimit: "${TMP_SIZE}"
---
apiVersion: batch/v1
kind: Job
metadata:
  name: pi-worker-${RUN_ID}
  namespace: people-index
  labels:
    app.kubernetes.io/name: people-index
    app.kubernetes.io/component: worker
    app.kubernetes.io/part-of: people-index
    people-index.io/run-id: "${RUN_ID}"
spec:
  parallelism: ${WORKERS}
  backoffLimit: ${WORKER_BACKOFF_LIMIT}
  activeDeadlineSeconds: ${RUN_DEADLINE_SECONDS}
  ttlSecondsAfterFinished: 86400
  podFailurePolicy:
    rules:
      - action: Ignore
        onPodConditions:
          - type: DisruptionTarget
  template:
    metadata:
      labels:
        app.kubernetes.io/name: people-index
        app.kubernetes.io/component: worker
        app.kubernetes.io/part-of: people-index
        people-index.io/run-id: "${RUN_ID}"
        people-index.io/es-client: "true"
        people-index.io/s3-client: "true"
    spec:
      restartPolicy: Never
      serviceAccountName: people-index-pipeline
      automountServiceAccountToken: false
      enableServiceLinks: false
      # Time to stop cleanly on SIGTERM; a task a worker leaves behind is taken over by another
      # worker once its lease expires (PI_LEASE_TTL).
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      # Spread this run's workers evenly over zones (hard) and nodes (soft): a lost zone or
      # node takes a fair share of the workers with it, never all of them. nodeTaintsPolicy
      # Honor leaves tainted nodes (an unreachable or not-ready zone) out of the count, so
      # replacements for a lost zone's workers can still be placed in the others.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          nodeTaintsPolicy: Honor
          labelSelector:
            matchLabels:
              app.kubernetes.io/component: worker
              people-index.io/run-id: "${RUN_ID}"
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          nodeTaintsPolicy: Honor
          labelSelector:
            matchLabels:
              app.kubernetes.io/component: worker
              people-index.io/run-id: "${RUN_ID}"
      # Prefer nodes without an Elasticsearch data node: the join and the gzip/zstd work are
      # CPU-heavy and would otherwise compete with indexing on the same cores.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 50
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    elasticsearch.k8s.elastic.co/node-data: "true"
      containers:
        - name: people-index
          image: ${IMAGE}
          imagePullPolicy: ${IMAGE_PULL_POLICY}
          args: ["worker"]
          envFrom:
            - configMapRef:
                name: people-index-config
          env:
            - name: PI_RUN_ID
              value: "${RUN_ID}"
            - name: PI_WORKER_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: PI_CONCURRENCY
              value: "${WORKER_CONCURRENCY}"
            - name: PI_ES_USERNAME
              valueFrom:
                secretKeyRef:
                  name: pipeline-es-credentials
                  key: username
            - name: PI_ES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pipeline-es-credentials
                  key: password
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: s3-credentials
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: s3-credentials
                  key: AWS_SECRET_ACCESS_KEY
            - name: TMPDIR
              value: /tmp
          ports:
            - name: metrics
              containerPort: 9464
          # Memory is bounded by configuration (PI_TASK_MEMORY_BYTES, PI_BUFFER_BYTES, segment
          # and bulk sizes) times PI_CONCURRENCY, never by the input size, so the limit is set
          # once per worker shape (docs/OPERATIONS.md, Sizing).
          resources:
            requests:
              cpu: "${WORKER_CPU}"
              memory: "${WORKER_MEMORY}"
              ephemeral-storage: 256Mi
            limits:
              memory: "${WORKER_MEMORY}"
              ephemeral-storage: "${TMP_SIZE}"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: es-ca
              mountPath: /etc/people-index/es-ca
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: es-ca
          secret:
            secretName: es-es-http-certs-public
            items:
              - key: ca.crt
                path: ca.crt
        - name: tmp
          emptyDir:
            sizeLimit: "${TMP_SIZE}"
