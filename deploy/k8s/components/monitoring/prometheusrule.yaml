# Alerts for Elasticsearch and pipeline Jobs and alias freshness. Elasticsearch thresholds follow its defaults:
# at the 85% low disk watermark it stops allocating shards to a node, and a heap above 90% for
# long means GC pressure.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: people-index-elasticsearch
spec:
  groups:
    - name: people-index.elasticsearch
      rules:
        - alert: ElasticsearchExporterDown
          expr: up{job="elasticsearch-exporter"} == 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: elasticsearch-exporter cannot be scraped, so the other alerts here are blind.
        - alert: ElasticsearchClusterRed
          expr: elasticsearch_cluster_health_status{color="red"} == 1
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: A primary shard is unassigned; writes to it fail and publish will refuse the alias move.
        - alert: ElasticsearchClusterYellow
          expr: elasticsearch_cluster_health_status{color="yellow"} == 1
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: Replicas unassigned for 30 minutes (normal for a short while after publish restores replicas).
        - alert: ElasticsearchDiskLow
          expr: |
            1 - (elasticsearch_filesystem_data_available_bytes / elasticsearch_filesystem_data_size_bytes) > 0.80
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Node {{ $labels.name }} is above 80% disk; at 85% Elasticsearch stops allocating shards to it."
        - alert: ElasticsearchHeapHigh
          expr: |
            elasticsearch_jvm_memory_used_bytes{area="heap"} / elasticsearch_jvm_memory_max_bytes{area="heap"} > 0.90
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Node {{ $labels.name }} heap above 90% for 15 minutes; lower the workers or PI_SENDERS_PER_WORKER."
        - alert: ElasticsearchBulkRejections
          expr: increase(elasticsearch_thread_pool_rejected_count{type="write"}[5m]) > 0
          for: 10m
          labels:
            severity: info
          annotations:
            summary: The write thread pool keeps rejecting bulk requests (429s the loader retries); the cluster is the bottleneck.
        - alert: ElasticsearchNoRecentSnapshot
          expr: time() - elasticsearch_snapshot_stats_latest_snapshot_timestamp_seconds > 2 * 86400
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "No successful snapshot in repository {{ $labels.repository }} for two days."
    - name: people-index.pipeline
      rules:
        - alert: PeopleIndexJobFailed
          expr: |
            (kube_job_failed{condition="true"} == 1) * on(namespace, job_name) group_left(label_app_kubernetes_io_component)
              max by (namespace, job_name, label_app_kubernetes_io_component) (kube_job_labels{label_app_kubernetes_io_name="people-index", label_app_kubernetes_io_component=~"coordinator|worker"})
          labels:
            severity: critical
          annotations:
            summary: "Pipeline Job {{ $labels.namespace }}/{{ $labels.job_name }} failed."
        - alert: PeopleIndexJobStalled
          expr: |
            (time() - kube_job_status_start_time > 3 * 3600)
              and on(namespace, job_name) (kube_job_status_active > 0)
              * on(namespace, job_name) group_left(label_app_kubernetes_io_component)
                max by (namespace, job_name, label_app_kubernetes_io_component) (kube_job_labels{label_app_kubernetes_io_name="people-index", label_app_kubernetes_io_component=~"coordinator|worker"})
          labels:
            severity: warning
          annotations:
            summary: "Pipeline Job {{ $labels.namespace }}/{{ $labels.job_name }} has been active for over 3 hours."
        - alert: PeopleIndexAliasOld
          expr: |
            time() - max(elasticsearch_indices_settings_creation_timestamp_seconds * on(index) group_left()
              elasticsearch_indices_aliases{alias="persons"}) > 26 * 3600
          labels:
            severity: warning
          annotations:
            summary: The index behind the persons alias was created over 26 hours ago.
        - alert: PeopleIndexAliasMissing
          expr: absent(elasticsearch_indices_settings_creation_timestamp_seconds * on(index) group_left() elasticsearch_indices_aliases{alias="persons"})
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: The persons alias has no index, or alias or creation timestamp metrics are unavailable.
        - alert: PeopleIndexJobLabelsMissing
          expr: |
            count by (namespace) (kube_job_labels{job_name=~"pi-.+"})
              unless on(namespace) count by (namespace) (kube_job_labels{job_name=~"pi-.+", label_app_kubernetes_io_name!=""})
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Job name labels are unavailable from kube-state-metrics in namespace {{ $labels.namespace }}."
