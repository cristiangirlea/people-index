# The Elasticsearch cluster, run by the ECK operator (deploy/k8s/eck).
#
# Shape: three dedicated master nodes and three data nodes, each node set spread across the
# zones in `topology.kubernetes.io/zone`. Masters only coordinate, so a heavy bulk load on the
# data nodes never starves cluster-state updates; three of them survive the loss of one zone.
#
# Zone awareness: ECK copies the node's zone label onto the pod as an annotation (the
# downward-node-labels annotation below; the operator's `exposed-node-labels` already allows
# topology.kubernetes.io/*), the pod reads it into $ZONE, and Elasticsearch gets it as the
# `zone` node attribute. With `cluster.routing.allocation.awareness.attributes` naming it,
# a primary and its replica never share a zone, so losing a zone loses no data once
# replicas are restored by `publish`.
#
# Overlays patch this resource with JSON 6902 patches that address node sets by index, each
# guarded by a `test` op on the name: index 0 is `master`, index 1 is `data`. Keep that order.
apiVersion: elasticsearch.k8s.elastic.co/v1
kind: Elasticsearch
metadata:
  name: es
  annotations:
    eck.k8s.elastic.co/downward-node-labels: "topology.kubernetes.io/zone"
spec:
  version: 9.5.5
  # The image ECK would pick for `version`, pinned by digest; keep the two in step.
  image: docker.elastic.co/elasticsearch/elasticsearch:9.5.5@sha256:13b4a40bb095774f5fda635e45fd5677cc6a26565e42b24997b0c72b88e75984
  auth:
    roles:
      # roles.yml from this directory, generated by kustomize.
      - secretName: people-index-es-roles
    fileRealm:
      # A kubernetes.io/basic-auth Secret with username, password and roles: ECK turns it into
      # a file-realm user, and the pipeline pods read the same Secret for PI_ES_USERNAME and
      # PI_ES_PASSWORD, so there is one place to rotate the password.
      - secretName: pipeline-es-credentials
  nodeSets:
    - name: master
      count: 3
      config:
        # For a different PI_ALIAS, edit this pattern to match it.
        action.auto_create_index: "-persons-*,+*"
        node.roles: ["master"]
        node.attr.zone: ${ZONE}
        cluster.routing.allocation.awareness.attributes: k8s_node_name,zone
      podTemplate:
        metadata:
          labels:
            app.kubernetes.io/name: elasticsearch
            app.kubernetes.io/component: master
        spec:
          # ECK's default pod security context, spelled out because a podTemplate one replaces
          # it (uid/gid 1000 is the image's elasticsearch user; fsGroup makes volumes
          # writable), plus the RuntimeDefault seccomp profile.
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: elasticsearch
              env:
                - name: ZONE
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.annotations['topology.kubernetes.io/zone']
                # An explicit heap keeps the JVM's footprint predictable; the limit leaves the
                # other half of the memory to the OS page cache and off-heap buffers. Memory
                # request equals limit (no overcommit, last to be evicted); no CPU limit, so a
                # merge or a recovery is never throttled by CFS quotas.
                - name: ES_JAVA_OPTS
                  value: "-Xms1g -Xmx1g"
              resources:
                requests:
                  cpu: 500m
                  memory: 2Gi
                limits:
                  memory: 2Gi
          topologySpreadConstraints:
            - maxSkew: 1
              topologyKey: topology.kubernetes.io/zone
              whenUnsatisfiable: DoNotSchedule
              labelSelector:
                matchLabels:
                  elasticsearch.k8s.elastic.co/cluster-name: es
                  elasticsearch.k8s.elastic.co/statefulset-name: es-es-master
            - maxSkew: 1
              topologyKey: kubernetes.io/hostname
              whenUnsatisfiable: DoNotSchedule
              labelSelector:
                matchLabels:
                  elasticsearch.k8s.elastic.co/cluster-name: es
                  elasticsearch.k8s.elastic.co/statefulset-name: es-es-master
      volumeClaimTemplates:
        - metadata:
            name: elasticsearch-data
          spec:
            accessModes: ["ReadWriteOnce"]
            resources:
              requests:
                storage: 4Gi
    - name: data
      count: 3
      config:
        # For a different PI_ALIAS, edit this pattern to match it.
        action.auto_create_index: "-persons-*,+*"
        node.roles: ["data", "data_content", "data_hot", "ingest"]
        node.attr.zone: ${ZONE}
        cluster.routing.allocation.awareness.attributes: k8s_node_name,zone
      podTemplate:
        metadata:
          labels:
            app.kubernetes.io/name: elasticsearch
            app.kubernetes.io/component: data
        spec:
          # ECK's default pod security context, spelled out because a podTemplate one replaces
          # it (uid/gid 1000 is the image's elasticsearch user; fsGroup makes volumes
          # writable), plus the RuntimeDefault seccomp profile.
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: elasticsearch
              env:
                - name: ZONE
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.annotations['topology.kubernetes.io/zone']
                - name: ES_JAVA_OPTS
                  value: "-Xms2g -Xmx2g"
              resources:
                requests:
                  cpu: "1"
                  memory: 4Gi
                limits:
                  memory: 4Gi
          topologySpreadConstraints:
            - maxSkew: 1
              topologyKey: topology.kubernetes.io/zone
              whenUnsatisfiable: DoNotSchedule
              labelSelector:
                matchLabels:
                  elasticsearch.k8s.elastic.co/cluster-name: es
                  elasticsearch.k8s.elastic.co/statefulset-name: es-es-data
            - maxSkew: 1
              topologyKey: kubernetes.io/hostname
              whenUnsatisfiable: ScheduleAnyway
              labelSelector:
                matchLabels:
                  elasticsearch.k8s.elastic.co/cluster-name: es
                  elasticsearch.k8s.elastic.co/statefulset-name: es-es-data
      volumeClaimTemplates:
        - metadata:
            name: elasticsearch-data
          spec:
            accessModes: ["ReadWriteOnce"]
            resources:
              requests:
                storage: 20Gi
