# Everything that persists between runs: the namespace, Elasticsearch (ECK), the in-cluster
# object store, the pipeline's identity and settings, and the network policies.
#
# Not applied on its own: an overlay adds the credentials (pipeline-es-credentials,
# s3-credentials, snapshot-s3-credentials) from git-ignored env files and sizes the cluster. Runs are Jobs rendered from
# deploy/k8s/jobs, which refer to the names below, so generated names carry no hash suffix.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: people-index

labels:
  - pairs:
      app.kubernetes.io/part-of: people-index
    includeSelectors: false

resources:
  - namespace.yaml
  - pipeline-serviceaccount.yaml
  - networkpolicies.yaml
  - elasticsearch/elasticsearch.yaml
  - s3/seaweedfs.yaml
  - s3/bucket-init-job.yaml

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  # The PI_* settings every pipeline pod loads with envFrom (docs/ARCHITECTURE.md,
  # Configuration). Per-run values (PI_RUN_ID, PI_WORKER_ID, PI_CONCURRENCY) are set on the
  # Jobs; credentials come from Secrets.
  - name: people-index-config
    literals:
      - PI_STORE_URL=s3://people-index/
      - PI_S3_ENDPOINT=http://s3:8333
      - AWS_REGION=us-east-1
      - PI_ES_URL=https://es-es-http:9200
      - PI_ES_CA_CERT=/etc/people-index/es-ca/ca.crt
      - PI_ALIAS=persons
      - PI_EXECUTOR=distributed
      - PI_LEASE_TTL=60s
      - PI_INDEX_REPLICAS=1
      - PI_INDEX_CODEC=best_compression
      - PI_RETAIN_RUNS=3
      - PI_PUBLISH_MIN_SHARE=0.9
      - PI_PUBLISH_MAX_UNRESOLVED=0.25
      - PI_PUBLISH_ALLOW_EMPTY_ORGANIZATIONS=false
      - PI_BULK_MAX_BYTES=8388608
      - PI_SENDERS_PER_WORKER=2
      # Per-task memory (docs/OPERATIONS.md, Sizing): about PI_TASK_MEMORY_BYTES +
      # PI_BUFFER_BYTES + 8 x PI_SEGMENT_TARGET_BYTES + 32 MiB = 416 MiB here, which fits
      # WORKER_MEMORY / WORKER_CONCURRENCY of the local overlay (1Gi / 2) and its 512Mi
      # coordinator, which runs single-task stages (an extract stage with one file) itself.
      # The production example raises all three.
      - PI_TASK_MEMORY_BYTES=192MiB
      - PI_BUFFER_BYTES=64MiB
      - PI_SEGMENT_TARGET_BYTES=16MiB
      - PI_METRICS_ADDR=0.0.0.0:9464
      - PI_LOG_FORMAT=json
      # A feed with other field names reads its schema and index mapping from files
      # (docs/OPERATIONS.md, Feed schema); unset, the built-in ones. Set both only in an
      # overlay that mounts the files into every pipeline pod from a ConfigMap (the example
      # in that section), never here:
      # - PI_SCHEMA_FILE=/etc/people-index/feed/schema.json
      # - PI_MAPPING_FILE=/etc/people-index/feed/mapping.json
  - name: s3-bucket-init
    files:
      - bucket-init.sh=s3/bucket-init.sh
      - identity-config.sh=s3/identity-config.sh

secretGenerator:
  # Role definitions are not secret, but ECK reads them only from a Secret.
  - name: people-index-es-roles
    files:
      - roles.yml=elasticsearch/roles.yml
