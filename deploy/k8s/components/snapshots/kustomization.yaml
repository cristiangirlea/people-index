# Snapshots of the published index to the object store.
#
# - Elasticsearch gets the S3 client settings (endpoint, path-style addressing) on every node
#   and the store's keys in its keystore through ECK secureSettings, read from the same
#   `s3-credentials` Secret the pipeline uses.
# - A bootstrap Job (bootstrap.sh) registers the repository `people-index` (bucket
#   `people-index`, prefix `snapshots/`, beside `raw/` and `runs/`) and the SLM policy
#   `nightly` (01:30 UTC, `persons*`, kept 14 days, at least 3).
# - A NetworkPolicy lets Elasticsearch reach the store.
#
# Verified with Elasticsearch 9.5.5 against SeaweedFS 4.48 in containers: the repository
# registers (with node verification), the policy installs, and a snapshot completes.
#
# For an external store, patch `s3.client.default.endpoint` and `protocol` on both node sets
# (see overlays/production-example).
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

resources:
  - bootstrap-job.yaml
  - networkpolicy.yaml

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: snapshot-bootstrap
    files:
      - bootstrap.sh

patches:
  - target:
      group: elasticsearch.k8s.elastic.co
      kind: Elasticsearch
      name: es
    path: elasticsearch-patch.yaml
