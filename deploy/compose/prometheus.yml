# Prometheus for the compose stack (profile metrics). Targets come from Docker's DNS: the name
# `worker` resolves to every replica, so `--scale worker=N` needs no change here.
global:
  scrape_interval: 5s
  evaluation_interval: 15s

scrape_configs:
  - job_name: people-index-worker
    dns_sd_configs:
      - names: [worker]
        type: A
        port: 9464
        refresh_interval: 5s

  - job_name: people-index-coordinator
    dns_sd_configs:
      - names: [coordinator]
        type: A
        port: 9464
        refresh_interval: 5s

  - job_name: s3
    static_configs:
      - targets: ["s3:9327"]
